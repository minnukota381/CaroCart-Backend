spring.application.name=CartService

server.port=${PORT:8080}

server.address=0.0.0.0

# ---- TURN OFF EUREKA/DISCOVERY ON CLOUD RUN ----
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

eureka.instance.hostname=https://carocart-cartservice-272629239226.asia-south1.run.app
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health

# Logging
logging.level.org.springframework.web=ERROR

# --- Database Config (Cloud SQL) ---
spring.datasource.url=jdbc:mysql://google/carocartcart?cloudSqlInstance=sound-memory-470316-m4:asia-south1:carocartindia&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.main.allow-bean-definition-overriding=true
# Feign Client settings (can also be configured per-client if needed)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

jwt.secret=${JWT_Token}

order.service.url=https://carocart-order-272629239226.asia-south1.run.app
product.service.url=https://carocart-productservice-272629239226.asia-south1.run.app
authentication.service.url=https://carocart-authentication-272629239226.asia-south1.run.app

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
