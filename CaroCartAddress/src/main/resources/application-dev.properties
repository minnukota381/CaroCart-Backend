spring.application.name=CaroCartAddress

server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

cors.allowed-origins=http://localhost:5173

security.internal-system-token=${INTERNAL_SYSTEM_JWT:}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# MySQL datasource settings
spring.datasource.url=jdbc:mysql://google/carocartaddress?cloudSqlInstance=decoded-plane-466210-j7:asia-south1:carocart-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=carouser
spring.datasource.password=NeptunE2509@CaroCart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

