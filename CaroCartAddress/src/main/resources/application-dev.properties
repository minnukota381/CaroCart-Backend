spring.application.name=CaroCartAddress


server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# MySQL datasource settings
spring.datasource.url=jdbc:mysql://localhost:3306/carocartaddress?createDatabaseIfNotExist=true
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MapmyIndia API credentials for backend
mapmyindia.rest.api.client_id=${MAPMYINDIA_CLIENT_ID}
mapmyindia.rest.api.client_secret=${MAPMYINDIA_CLIENT_SECRET}
