# ==============================
# CaroCartDeliveryService
# ==============================

spring.application.name=CaroCartDeliveryService
server.port=8088

# Allow CORS for frontend (adjust as per your frontend port/domain)
cors.allowed-origins=http://localhost:5173


spring.security.user.name=disabled
spring.security.user.password=disabled


# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8


# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.carocart=DEBUG

# MySQL datasource settings
spring.datasource.url=jdbc:mysql://google/carocartdelivery?cloudSqlInstance=decoded-plane-466210-j7:asia-south1:carocart-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=carouser
spring.datasource.password=NeptunE2509@CaroCart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Multipart upload config (Optional, if needed)
# Max file size for a single file (e.g. 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
#spring.servlet.multipart.max-file-count=10


# JWT secret and expiration (ensure you have JWT_Token defined in your environment variables or replace with actual secret)
jwt.secret=${JWT_Token}
jwt.expiration=604800000

# Notification service URL (optional)
# carocart.notification.url=http://localhost:8087

order.service.url=http://localhost:8084

