# ==============================
# CaroCartDeliveryService
# ==============================

spring.application.name=CaroCartDeliveryService
server.port=8088

# Allow CORS for frontend (adjust as per your frontend port/domain)
cors.allowed-origins=http://localhost:5173

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.carocart=DEBUG

# MySQL datasource settings
spring.datasource.url=jdbc:mysql://localhost:3306/carocartdelivery?createDatabaseIfNotExist=true
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Feign (Optional, if using Hystrix for circuit breaker)
feign.hystrix.enabled=true

# (Optional) Max upload size (if you need image upload for delivery boy profile)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# (Optional) JWT secret (if you implement JWT auth for delivery boys in future)
# jwt.secret=${JWT_Token}

# (Optional) If you want to send notifications, put the notification service URL here
# carocart.notification.url=http://localhost:8087

