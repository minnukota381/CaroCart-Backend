spring.application.name=CaroCartDeliveryService
server.port=${PORT:8080}


# ---- TURN OFF EUREKA/DISCOVERY ON CLOUD RUN ----
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false


eureka.instance.hostname=https://carocart-delivery-272629239226.asia-south1.run.app
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health


order.service.url=https://carocart-order-272629239226.asia-south1.run.app
product.service.url=https://carocart-productservice-272629239226.asia-south1.run.app
authentication.service.url=https://carocart-authentication-272629239226.asia-south1.run.app

address.service.url=https://carocart-address-272629239226.asia-south1.run.app
cart.service.url=https://carocart-cartservice-272629239226.asia-south1.run.app
delivery.service.url=https://carocart-delivery-272629239226.asia-south1.run.app
payment.service.url=https://carocart-payment-272629239226.asia-south1.run.app
notification.service.url=https://carocart-notifications-272629239226.asia-south1.run.app

# --- Database Config (Cloud SQL) ---
spring.datasource.url=jdbc:mysql://google/carocartdelivery?cloudSqlInstance=sound-memory-470316-m4:asia-south1:carocartindia&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8


# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.carocart=DEBUG

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Multipart upload config (Optional, if needed)
# Max file size for a single file (e.g. 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
#spring.servlet.multipart.max-file-count=10


# JWT secret and expiration (ensure you have JWT_Token defined in your environment variables or replace with actual secret)
jwt.secret=${JWT_Token}
jwt.expiration=604800000

# Notification service URL (optional)
# carocart.notification.url=http://localhost:8087


