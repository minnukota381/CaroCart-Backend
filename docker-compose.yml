version: "3.9"

services:
  eureka-server:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  authentication:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-authentication:latest
    container_name: authentication
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  productservice:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-productservice:latest
    container_name: productservice
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  cartservice:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-cartservice:latest
    container_name: cartservice
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  orderservice:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-orderservice:latest
    container_name: orderservice
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  address:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-address:latest
    container_name: address
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  paymentservice:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-paymentservice:latest
    container_name: paymentservice
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  notifications:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-notifications:latest
    container_name: notifications
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env

  apigateway:
    image: 815931044195.dkr.ecr.ap-south-1.amazonaws.com/carocart-apigateway:latest
    container_name: apigateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - .env
