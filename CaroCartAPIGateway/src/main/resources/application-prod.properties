spring.application.name=CAROCARTAPIGATEWAY
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- TURN OFF EUREKA/DISCOVERY ON CLOUD RUN ----
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# Actuator (your previous settings)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ------------------- GATEWAY ROUTES (STATIC HTTPS) -------------------

# 1) AUTHENTICATION  (/users/**,/admins/**,/vendors/**,/password/**)
spring.cloud.gateway.routes[0].id=CaroCartAuthentication
spring.cloud.gateway.routes[0].uri=https://carocart-authentication-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**,/admins/**,/vendors/**,/password/**

# 2) PRODUCT  (/products/**,/categories/**,/subcategories/**)
spring.cloud.gateway.routes[1].id=CaroCartProductService
spring.cloud.gateway.routes[1].uri=https://carocart-productservice-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**,/categories/**,/subcategories/**

# 3) CART  (/cart/**)
spring.cloud.gateway.routes[2].id=CaroCartCartService
spring.cloud.gateway.routes[2].uri=https://carocart-cartservice-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[2].predicates[0]=Path=/cart/**

# 4) ORDER  (/orders/**)
spring.cloud.gateway.routes[3].id=CaroCartOrderService
spring.cloud.gateway.routes[3].uri=https://carocart-order-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[3].predicates[0]=Path=/orders/**

# 5) PAYMENT  (gateway path: /api/payments/**  -> service path: /payments/**)
spring.cloud.gateway.routes[4].id=CaroCartPaymentService
spring.cloud.gateway.routes[4].uri=https://carocart-payment-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/payments/(?<seg>.*), /payments/${seg}

# 6) ADDRESS  (gateway path: /api/addresses/** -> service path: /addresses/**)
spring.cloud.gateway.routes[5].id=CaroCartAddress
spring.cloud.gateway.routes[5].uri=https://carocart-address-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/addresses/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/addresses/(?<seg>.*), /addresses/${seg}

# 7) NOTIFICATIONS  (/notifications/**)
spring.cloud.gateway.routes[6].id=CaroCartNotifications
spring.cloud.gateway.routes[6].uri=https://carocart-notifications-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**

# 8) sitemap.xml -> product service
spring.cloud.gateway.routes[7].id=sitemap
spring.cloud.gateway.routes[7].uri=https://carocart-productservice-272629239226.asia-south1.run.app
spring.cloud.gateway.routes[7].predicates[0]=Path=/sitemap.xml

# --------------------- CORS ---------------------
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=\
http://localhost:5173,\
https://carocart.com,\
https://www.carocart.com,\
https://carocart-user.web.app,\
https://carocart-delivery.web.app,\
https://carocart-admin.web.app,\
https://carocart-vendor.web.app, \
https://admin.carocart.com, \
https://delivery.carocart.com, \
https://seller.carocart.com,
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
