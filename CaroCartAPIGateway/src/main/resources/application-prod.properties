# ---------------------
# (Optional) CORS Example
# ---------------------
# --- CORS for Spring Cloud Gateway (allow both local and prod frontend) ---

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173,https://carocart.com,https://www.carocart.com,carocart-user.web.app,carocart-delivery.web.app,carocart-admin.web.app,carocart-vendor.web.app
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always


