spring.application.name=CaroCartAPIGateway

server.port=8080

# Eureka (service discovery)
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.client.service-url.defaultZone=https://carocart-backend.onrender.com/eureka
eureka.client.service-url.defaultZone=http://carocart-server-env.eba-bbanh9jy.ap-south-1.elasticbeanstalk.com/eureka

# -------------------
# Gateway Routing
# -------------------

# 1. AUTHENTICATION
spring.cloud.gateway.routes[0].id=CaroCartAuthentication
spring.cloud.gateway.routes[0].uri=lb://CAROCARTAUTHENTICATION
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**,/admins/**,/vendors/**,/password/**

# 2. PRODUCT
spring.cloud.gateway.routes[1].id=CaroCartProductService
spring.cloud.gateway.routes[1].uri=lb://CAROCARTPRODUCTSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**,/categories/**,/subcategories/**

# 3. CART
spring.cloud.gateway.routes[2].id=CartService
spring.cloud.gateway.routes[2].uri=lb://CARTSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/cart/**

# 4. ORDER
spring.cloud.gateway.routes[3].id=OrderService
spring.cloud.gateway.routes[3].uri=lb://ORDERSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/orders/**

# 5. PAYMENT
spring.cloud.gateway.routes[4].id=PaymentService
spring.cloud.gateway.routes[4].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/payments/**

# 6. ADDRESS
spring.cloud.gateway.routes[5].id=CaroCartAddress
spring.cloud.gateway.routes[5].uri=lb://CAROCARTADDRESS
spring.cloud.gateway.routes[5].predicates[0]=Path=/address/**

# 7. NOTIFICATION
spring.cloud.gateway.routes[6].id=CaroCartNotifications
spring.cloud.gateway.routes[6].uri=lb://CAROCARTNOTIFICATIONS
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**

# 8. EUREKA SERVER (Optional, for /eureka if you want gateway access)
# spring.cloud.gateway.routes[7].id=eureka-server
# spring.cloud.gateway.routes[7].uri=http://localhost:8761
# spring.cloud.gateway.routes[7].predicates[0]=Path=/eureka/**

# 9. Any Future Microservice Example
# spring.cloud.gateway.routes[8].id=delivery-service
# spring.cloud.gateway.routes[8].uri=lb://DELIVERYSERVICE
# spring.cloud.gateway.routes[8].predicates[0]=Path=/delivery/**

# ---------------------
# (Optional) CORS Example
# ---------------------
# --- CORS for Spring Cloud Gateway (allow both local and prod frontend) ---

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173,https://carocart.com,https://www.carocart.com,https://carocart.vercel.app
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

