spring.application.name=CAROCARTNOTIFICATIONS
server.port=${PORT:8080}

server.address=0.0.0.0
# Eureka
eureka.client.service-url.defaultZone=https://carocart-server-272629239226.asia-south1.run.app/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Force Eureka to register with public hostname
eureka.instance.hostname=carocart-Notifications-983951638539.asia-south1.run.app
eureka.instance.non-secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health


#cors.allowed-origins=https://carocart.vercel.app,https://carocart.com,https://www.carocart.com
# Logging
logging.level.org.springframework.web=ERROR

# SMTP Email Configuration for Production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

from.email=${company_mail}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
