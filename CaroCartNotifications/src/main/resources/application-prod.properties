spring.application.name=CaroCartNotifications


server.port=8087

#eureka.client.service-url.defaultZone=https://carocart-backend.onrender.com/eureka
eureka.client.service-url.defaultZone=http://carocart-server-env.eba-bbanh9jy.ap-south-1.elasticbeanstalk.com/eureka

carocart.notification.url=https://carocartnotifications.onrender.com
carocart.product.url=https://carocartproductservice.onrender.com
carocart.auth.url=https://carocartauthentication.onrender.com
carocart.address.url=https://carocartaddress.onrender.com
carocart.cart.url=https://cartservice-j4tu.onrender.com
order.service.url=https://orderservice-rw14.onrender.com
address.service.url=https://carocartaddress.onrender.com

cors.allowed-origins=https://carocart.vercel.app,https://carocart.com,https://www.carocart.com

# Logging
logging.level.org.springframework.web=ERROR

# SMTP Email Configuration for Production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

from.email=${company_mail}
