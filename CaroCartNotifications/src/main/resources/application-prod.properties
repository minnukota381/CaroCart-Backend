spring.application.name=CAROCARTNOTIFICATIONS
server.port=8087

server.address=0.0.0.0

eureka.client.service-url.defaultZone=http://13.202.93.7:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Eureka instance meta ---
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.hostname=${HOSTNAME}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}
eureka.instance.status-page-url=http://${HOSTNAME}:${server.port}/actuator/info
eureka.instance.health-check-url=http://${HOSTNAME}:${server.port}/actuator/health
eureka.instance.home-page-url=http://${HOSTNAME}:${server.port}/

#cors.allowed-origins=https://carocart.vercel.app,https://carocart.com,https://www.carocart.com
# Logging
logging.level.org.springframework.web=ERROR

# SMTP Email Configuration for Production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

from.email=${company_mail}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
