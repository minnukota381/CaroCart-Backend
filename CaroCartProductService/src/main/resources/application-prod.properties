spring.application.name=CAROCARTPRODUCTSERVICE
server.port=${PORT:8080}
server.address=0.0.0.0

eureka.client.service-url.defaultZone=https://carocart-server-272629239226.asia-south1.run.app/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Force Eureka to register with public hostname
eureka.instance.hostname=carocart-productservice-983951638539.asia-south1.run.app
eureka.instance.non-secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health
# Logging
logging.level.org.springframework.web=ERROR

# --- Google Cloud SQL ---
spring.datasource.url=jdbc:mysql://google/carocartproducts?cloudSqlInstance=sound-memory-470316-m4:asia-south1:carocartindia&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

sitemap.base-url=https://www.carocart.com

jwt.secret=${JWT_Token}


