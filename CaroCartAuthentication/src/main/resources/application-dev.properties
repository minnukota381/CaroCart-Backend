# =========================
# App & Server
# =========================
spring.application.name=CaroCartAuthentication
server.port=8081
server.forward-headers-strategy=native

# CORS (local FE + gateway)
cors.allowed-origins=http://localhost:5173,http://localhost:8080

# =========================
# Service Discovery (local)
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================
# Logging (dev friendly)
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# =========================
# Database (your existing Cloud SQL dev DB)
# =========================
spring.datasource.url=jdbc:mysql://google/carocartauth?cloudSqlInstance=decoded-plane-466210-j7:asia-south1:carocart-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=carouser
spring.datasource.password=NeptunE2509@CaroCart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# Email
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================
# JWT
# =========================
jwt.secret=${JWT_Token}

# =========================
# Google OAuth2 (LOCAL)
# IMPORTANT:
#   - In Google Console, add these Authorized redirect URIs:
#       http://localhost:8080/login/oauth2/code/google
#   - Add these Authorized JavaScript origins:
#       http://localhost:5173
# =========================
spring.security.oauth2.client.registration.google.client-id=272629239226-ebnsr4bri168alsde7ulf8un1eck3hbv.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile
# Let Spring infer baseUrl from the incoming request (will be http://localhost:8080 via gateway)
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Where to send the browser AFTER OAuth success/failure (frontend pages you host)
app.oauth.success-redirect=http://localhost:5173/oauth-success
app.oauth.failure-redirect=http://localhost:5173/oauth-failed

# Optional: default FE base if SecurityConfig needs it
app.frontend.base-url=http://localhost:5173

# =========================
# Multipart
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# OpenAPI / Swagger
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# application.properties
google.maps.apiKey=${GOOGLE_MAPS_API_KEY}
google.maps.mode=driving
