spring.application.name=CaroCartAuthentication

server.port=8081

cors.allowed-origins=http://localhost:5173

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


# MySQL datasource settings
spring.datasource.url=jdbc:mysql://google/carocartauth?cloudSqlInstance=decoded-plane-466210-j7:asia-south1:carocart-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=carouser
spring.datasource.password=NeptunE2509@CaroCart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

jwt.secret=${JWT_Token}



# OAuth2 (LOCAL Google client or shared client with multiple redirects)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID_LOCAL}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET_LOCAL}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Where to redirect after success/failure (frontend local)
app.oauth.success-redirect=http://localhost:5173/oauth-success
app.oauth.failure-redirect=http://localhost:5173/oauth-failed

# Ensure correct baseUrl behind proxies if any
server.forward-headers-strategy=native

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

