spring.application.name=CAROCARTAUTHENTICATION
server.port=8081
server.address=0.0.0.0

# Eureka
eureka.client.service-url.defaultZone=http://carocart-eureka-alb-553280150.ap-south-1.elb.amazonaws.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Eureka instance meta ---
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.hostname=${HOSTNAME}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}
eureka.instance.status-page-url=http://${HOSTNAME}:${server.port}/actuator/info
eureka.instance.health-check-url=http://${HOSTNAME}:${server.port}/actuator/health
eureka.instance.home-page-url=http://${HOSTNAME}:${server.port}/

spring.datasource.url=jdbc:mysql://carocart-db.cxo8ag0mqw2g.ap-south-1.rds.amazonaws.com:3306/carocartauthentication?createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=TwbddxkzImXVBhNj78Df
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# Email Configuration (set your Railway/Gmail env vars if needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

jwt.secret=${JWT_Token}

# OAuth Login Google (update redirect-uri for prod if needed)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://43.205.127.81:5000/login/oauth2/code/google

# change above to your prod domain when ready!

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true


