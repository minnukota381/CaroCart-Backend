spring.application.name=CaroCartAuthentication

server.port=8081

#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.service-url.defaultZone=https://carocart-backend.onrender.com/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# MySQL datasource settings for Railway
spring.datasource.url=jdbc:mysql://switchyard.proxy.rlwy.net:25938/carocartauthentication?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pkJdXUaPYqebbynPOBPwGyiOtmlfAdCT
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Email Configuration (set your Railway/Gmail env vars if needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

jwt.secret=${JWT_Token}

# OAuth Login Google (update redirect-uri for prod if needed)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://your-prod-domain.com/login/oauth2/code/google
# change above to your prod domain when ready!

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
