spring.application.name=CaroCartAuthentication
server.port=${PORT:8080}
server.address=0.0.0.0

# Honor X-Forwarded-* (Cloud Run ingress \u2192 API Gateway)
server.forward-headers-strategy=framework

# ---- TURN OFF EUREKA/DISCOVERY ON CLOUD RUN ----
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

eureka.instance.hostname=carocart-authentication-983951638539.asia-south1.run.app
eureka.instance.secure-port=443
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health

# --- Database Config (Cloud SQL) ---
spring.datasource.url=jdbc:mysql://google/carocartauth?cloudSqlInstance=sound-memory-470316-m4:asia-south1:carocartindia&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Logging ---
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# --- Email Config ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- JWT Secret ---
jwt.secret=${JWT_Token}

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# --- Frontend base URL (used for success/failure redirects in SecurityConfig)
app.frontend.base-url=${FRONTEND_BASE_URL:https://www.carocart.com}
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:${app.frontend.base-url}/oauth-success}
app.oauth.failure-redirect=${OAUTH_FAILURE_REDIRECT:${app.frontend.base-url}/oauth-failed}

# --- Multipart Uploads ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

notifications.service.url=https://carocart-notifications-272629239226.asia-south1.run.app
delivery.service.url=https://carocart-delivery-272629239226.asia-south1.run.app


# application.properties
google.maps.apiKey=${GOOGLE_MAPS_API_KEY}
google.maps.mode=driving

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# --- CORS ---
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://carocart.com,https://www.carocart.com,https://admin.carocart.com,https://seller.carocart.com,https://delivery.carocart.com}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
